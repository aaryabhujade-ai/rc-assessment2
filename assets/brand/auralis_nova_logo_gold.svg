<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E3B3" />
      <stop offset="35%" stop-color="#D4A64A" />
      <stop offset="70%" stop-color="#AA7C28" />
      <stop offset="100%" stop-color="#F9EBBE" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A64A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4A64A" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="16" fill="#0A0A0B" stroke="#26262B" stroke-width="1.5"/>

  <!-- Geometric Sound Wave / Nova Ring Icon -->
  <g transform="translate(110, 120)">
    <!-- Shockwave Outer Ring -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 6" opacity="0.6"/>
    <!-- Shockwave Mid Ring -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>
    <!-- Solid Gold Core Ring -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#subtleGlow)"/>
    <!-- Headphone Arc Silhouette -->
    <path d="M -16,10 C -16,-14 16,-14 16,10" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <rect x="-19" y="8" width="6" height="12" rx="3" fill="url(#goldGrad)"/>
    <rect x="13" y="8" width="6" height="12" rx="3" fill="url(#goldGrad)"/>
    <!-- Center Audio Star Pulse -->
    <circle cx="0" cy="-3" r="2.5" fill="#FFF5DC"/>
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(200, 115)">
    <!-- AURALIS -->
    <text x="0" y="0" font-family="'Inter', 'SF Pro Display', 'Cinzel', -apple-system, sans-serif" font-size="44" font-weight="300" letter-spacing="14" fill="url(#goldGrad)">
      AURALIS
    </text>
    <!-- NOVA -->
    <text x="320" y="0" font-family="'Playfair Display', 'Cinzel', 'Didot', serif" font-size="44" font-style="italic" font-weight="400" letter-spacing="8" fill="#F5F1E8">
      NOVA
    </text>
    <!-- Dividing Precision Line -->
    <line x1="0" y1="22" x2="480" y2="22" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
    <circle cx="240" cy="22" r="2.5" fill="url(#goldGrad)"/>
    <!-- Tagline -->
    <text x="0" y="48" font-family="'Inter', sans-serif" font-size="13" font-weight="400" letter-spacing="7" fill="#8E8E93">
      ACOUSTIC ARCHITECTURE · OBSIDIAN &amp; 24K GOLD
    </text>
  </g>
</svg>
